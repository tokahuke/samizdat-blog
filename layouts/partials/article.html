{{ partial "header.html" . }}

<main id="main"><article class="mx-auto max-w-3xl px-6 pt-16 pb-24">
  <header class="article-header">
    <time class="eyebrow" datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2006-01-02" }}</time>
    <h1 class="article-title">{{ .Title }}</h1>
    {{ with .Description }}<p class="page-subtitle">{{ . }}</p>{{ end }}
  </header>

  <div class="prose-samizdat">
    {{ .Content }}
  </div>
</article></main>

{{ partial "footer.html" . }}
